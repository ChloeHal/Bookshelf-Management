<!DOCTYPE html>
<html>
<head><title>Generateur icones Biblio</title></head>
<body style="font-family:sans-serif;padding:40px;text-align:center;">
<h2>Icones Ma Bibliotheque</h2>
<p>Clic droit sur chaque image > "Enregistrer l'image sous" dans le dossier <code>icons/</code></p>
<div style="display:flex;gap:40px;justify-content:center;margin-top:30px;">
  <div>
    <canvas id="c192" width="192" height="192"></canvas>
    <p><b>icon-192.png</b></p>
  </div>
  <div>
    <canvas id="c512" width="512" height="512"></canvas>
    <p><b>icon-512.png</b></p>
  </div>
</div>
<script>
function drawIcon(canvas) {
  const s = canvas.width;
  const ctx = canvas.getContext('2d');

  // Warm cream background (base-200)
  const r = s * 0.22;
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(s - r, 0);
  ctx.quadraticCurveTo(s, 0, s, r);
  ctx.lineTo(s, s - r);
  ctx.quadraticCurveTo(s, s, s - r, s);
  ctx.lineTo(r, s);
  ctx.quadraticCurveTo(0, s, 0, s - r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  ctx.fillStyle = '#ede5d8';
  ctx.fill();

  // Open book icon — simple, geometric
  const cx = s * 0.5;
  const cy = s * 0.48;

  // Left page
  ctx.beginPath();
  ctx.moveTo(cx, cy - s * 0.08);
  ctx.quadraticCurveTo(cx - s * 0.18, cy - s * 0.14, cx - s * 0.28, cy - s * 0.10);
  ctx.lineTo(cx - s * 0.28, cy + s * 0.16);
  ctx.quadraticCurveTo(cx - s * 0.18, cy + s * 0.12, cx, cy + s * 0.18);
  ctx.closePath();
  ctx.fillStyle = '#FF4D00';
  ctx.fill();

  // Right page
  ctx.beginPath();
  ctx.moveTo(cx, cy - s * 0.08);
  ctx.quadraticCurveTo(cx + s * 0.18, cy - s * 0.14, cx + s * 0.28, cy - s * 0.10);
  ctx.lineTo(cx + s * 0.28, cy + s * 0.16);
  ctx.quadraticCurveTo(cx + s * 0.18, cy + s * 0.12, cx, cy + s * 0.18);
  ctx.closePath();
  ctx.fillStyle = '#e04400';
  ctx.fill();

  // Spine line
  ctx.beginPath();
  ctx.moveTo(cx, cy - s * 0.08);
  ctx.lineTo(cx, cy + s * 0.18);
  ctx.strokeStyle = '#ede5d8';
  ctx.lineWidth = s * 0.012;
  ctx.stroke();
}

drawIcon(document.getElementById('c192'));
drawIcon(document.getElementById('c512'));
</script>
</body>
</html>
