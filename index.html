<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ma Bibliothèque!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="min-h-screen bg-base-200">
    <div class="max-w-6xl mx-auto p-4">
      <header class="text-center py-12">
        <h1
          class="text-4xl font-light tracking-tight bg-gradient-to-r from-base-content to-base-content/50 bg-clip-text text-primary mb-8"
        >
          Ma Bibliothèque !
        </h1>
        <div role="tablist" class="tabs tabs-border justify-center">
          <button
            role="tab"
            class="tab tab-active"
            onclick="showPage('list-page')"
          >
            Tous mes livres
          </button>
          <button role="tab" class="tab" onclick="showPage('wishlist-page')">
            Wishlist
          </button>
          <button role="tab" class="tab" onclick="showPage('challenge-page')">
            Mon Challenge
          </button>
          <button role="tab" class="tab" onclick="showPage('stats-page')">
            Statistiques
          </button>
          <button role="tab" class="tab" onclick="showPage('random-page')">
            Livre aléatoire
          </button>
        </div>
      </header>

      <!-- Page Liste des Livres -->
      <div id="list-page" class="page active">
        <div class="card card-border bg-base-100 mb-6">
          <div class="card-body">
            <h2 class="card-title">Ajouter un livre</h2>
            <div class="grid gap-4 md:grid-cols-3">
              <input
                type="text"
                id="book-title"
                class="input w-full"
                placeholder="Titre du livre"
              />
              <input
                type="text"
                id="book-author"
                class="input w-full"
                placeholder="Auteur"
              />
              <input
                type="text"
                id="book-genres"
                class="input w-full"
                placeholder="Genres (max 3, virgules)"
              />
            </div>
            <div class="flex items-center gap-4 mt-2">
              <label class="flex items-center gap-2 cursor-pointer">
                <input
                  type="checkbox"
                  id="book-gift"
                  class="toggle toggle-sm"
                  onchange="toggleGiftInput()"
                />
                <span class="text-sm">Cadeau</span>
              </label>
              <input
                type="number"
                id="book-year"
                class="input w-28"
                placeholder="Année"
                min="2000"
                max="2030"
              />
            </div>
            <div class="card-actions mt-4">
              <button onclick="addBook()" class="btn btn-primary">
                Ajouter à la bibliothèque
              </button>
            </div>
          </div>
        </div>

        <div
          id="stats"
          class="text-sm text-base-content/60 mb-6 flex items-center gap-2"
        ></div>
        <div
          id="books-container"
          class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3"
        ></div>
      </div>

      <!-- Page Wishlist -->
      <div id="wishlist-page" class="page">
        <div class="card card-border bg-base-100 mb-6">
          <div class="card-body">
            <h2 class="card-title">Ajouter à ma wishlist</h2>
            <div class="grid gap-4 md:grid-cols-3">
              <input type="text" id="wish-title" class="input w-full" placeholder="Titre du livre" />
              <input type="text" id="wish-author" class="input w-full" placeholder="Auteur" />
              <input type="text" id="wish-genres" class="input w-full" placeholder="Genres (max 3, virgules)" />
            </div>
            <div class="card-actions mt-4">
              <button onclick="addWishlistBook()" class="btn btn-primary">
                Ajouter à la wishlist
              </button>
            </div>
          </div>
        </div>
        <div id="wishlist-container" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3"></div>
      </div>

      <!-- Page Livre Aléatoire -->
      <div id="random-page" class="page">
        <div class="max-w-md mx-auto">
          <div class="card card-border bg-base-100 mb-6">
            <div class="card-body">
              <h2 class="card-title">Découvrir un livre</h2>
              <select id="genre-select" class="select w-full">
                <option disabled selected>Sélectionner un genre</option>
              </select>
              <button onclick="getRandomBook()" class="btn btn-primary w-full">
                Obtenir une suggestion
              </button>
            </div>
          </div>

          <div id="random-result" class="hidden">
            <div class="card card-border bg-base-100">
              <div class="card-body">
                <div class="text-xs uppercase tracking-wide text-primary mb-3">
                  Suggestion de lecture
                </div>
                <div id="random-book-content"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Page Statistiques -->
      <div id="stats-page" class="page">
        <div id="stats-content"></div>
      </div>

      <!-- Page Challenge -->
      <div id="challenge-page" class="page">
        <div id="challenge-content"></div>
      </div>
    </div>

    <!-- Modal sélecteur de livres pour le challenge -->
    <dialog id="book-selector-modal" class="modal">
      <div class="modal-box">
        <div class="flex justify-between items-center mb-4">
          <h3 class="font-bold text-lg">Ajouter un livre au challenge</h3>
          <button
            onclick="closeBookSelector()"
            class="btn btn-sm btn-circle btn-ghost"
          >
            ✕
          </button>
        </div>
        <input
          type="text"
          id="book-selector-search"
          class="input w-full mb-4"
          placeholder="Rechercher un livre..."
          oninput="filterBookSelector()"
        />
        <div id="book-selector-list" class="max-h-80 overflow-y-auto"></div>
      </div>
      <form method="dialog" class="modal-backdrop">
        <button>close</button>
      </form>
    </dialog>

    <script type="module" src="/script.js"></script>
  </body>
</html>
