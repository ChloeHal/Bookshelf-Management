      @import url("https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap");

      :root {
        /* Colors */
        --bg-primary: #e4e4e7;
        --bg-secondary: #f2f2f2;
        --bg-tertiary: #f8f8f8;
        --border-color: #e4e4e7;
        --text-primary: #3f3f47;
        --text-secondary: #888889;
        --text-muted: #888889;

        /* Primary color (accent) */
        --primary-500: #7af1a7;
        --primary-600: #5aed92;
        --primary-700: #35e97a;
        --primary-400: #a3f5c2;

        /* Spacing */
        --spacing-xs: 0.25rem;
        --spacing-sm: 0.5rem;
        --spacing-md: 1rem;
        --spacing-lg: 1.5rem;
        --spacing-xl: 2rem;
        --spacing-2xl: 3rem;

        /* Border radius */
        --radius-sm: 0.05rem;
        --radius-md: 0.1rem;
        --radius-lg: 0.15rem;

        /* Transitions */
        --transition: all 0.2s ease;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Lexend", -apple-system, BlinkMacSystemFont, sans-serif;
        background: var(--bg-primary);
        color: var(--text-primary);
        line-height: 1.6;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Container */
      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: var(--spacing-md);
      }

      /* Header */
      header {
        text-align: center;
        padding: var(--spacing-2xl) 0;
      }

      h1 {
        font-size: 2.5rem;
        font-weight: 300;
        letter-spacing: -0.025em;
        margin-bottom: var(--spacing-xl);
        background: linear-gradient(
          to right,
          var(--text-primary),
          var(--text-secondary)
        );
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      /* Navigation */
      nav {
        display: flex;
        justify-content: center;
        gap: var(--spacing-xl);
        border-bottom: 1px solid var(--border-color);
        padding-bottom: var(--spacing-md);
      }

      .nav-btn {
        background: none;
        border: none;
        color: var(--text-secondary);
        font-size: 0.95rem;
        font-weight: 500;
        padding: var(--spacing-sm) var(--spacing-lg);
        cursor: pointer;
        position: relative;
        transition: var(--transition);
      }

      .nav-btn:hover {
        color: var(--text-primary);
      }

      .nav-btn.active {
        color: var(--primary-500);
      }

      .nav-btn.active::after {
        content: "";
        position: absolute;
        bottom: calc(-1 * var(--spacing-md) - 1px);
        left: 0;
        right: 0;
        height: 2px;
        background: var(--primary-500);
      }

      /* Page containers */
      .page {
        display: none;
        padding-top: var(--spacing-2xl);
        animation: fadeIn 0.3s ease-in;
      }

      .page.active {
        display: block;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Card */
      .card {
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-lg);
        padding: var(--spacing-lg);
        margin-bottom: var(--spacing-lg);
      }

      .card-title {
        font-size: 1.125rem;
        font-weight: 500;
        margin-bottom: var(--spacing-lg);
        color: var(--text-primary);
      }

      /* Form elements */
      .form-grid {
        display: grid;
        gap: var(--spacing-md);
        margin-bottom: var(--spacing-lg);
      }

      @media (min-width: 768px) {
        .form-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      .input {
        width: 100%;
        padding: var(--spacing-sm) var(--spacing-md);
        background: var(--bg-tertiary);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        color: var(--text-primary);
        font-size: 0.9rem;
        transition: var(--transition);
      }

      .input:focus {
        outline: none;
        border-color: var(--primary-500);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
      }

      .input::placeholder {
        color: var(--text-muted);
      }

      /* Buttons */
      .btn {
        padding: var(--spacing-sm) var(--spacing-lg);
        font-size: 0.9rem;
        font-weight: 500;
        border: none;
        border-radius: var(--radius-md);
        cursor: pointer;
        transition: var(--transition);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--spacing-sm);
      }

      .btn-primary {
        background: var(--primary-500);
      }

      .btn-primary:hover {
        background: var(--primary-600);
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
      }

      .btn-primary:active {
        background: var(--primary-700);
        transform: translateY(0);
      }

      .btn-full {
        width: 100%;
      }

      .btn-delete {
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        padding: var(--spacing-xs);
        font-size: 1.25rem;
        line-height: 1;
        transition: var(--transition);
      }

      .btn-delete:hover {
        color: #ef4444;
      }

      /* Stats */
      .stats {
        color: var(--text-secondary);
        font-size: 0.875rem;
        margin-bottom: var(--spacing-lg);
        display: flex;
        align-items: center;
        gap: var(--spacing-sm);
      }

      .stats::before {
        content: "📚";
      }

      /* Books grid */
      .books-grid {
        display: grid;
        gap: var(--spacing-lg);
      }

      @media (min-width: 640px) {
        .books-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (min-width: 1024px) {
        .books-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      /* Book card */
      .book-card {
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-lg);
        padding: var(--spacing-lg);
        transition: var(--transition);
        position: relative;
      }

      .book-card:hover {
        border-color: var(--primary-500);
        box-shadow: 0 0 20px rgba(59, 130, 246, 0.1);
        transform: translateY(-2px);
      }

      .book-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: var(--spacing-sm);
      }

      .book-title {
        font-size: 1.125rem;
        font-weight: 500;
        color: var(--text-primary);
        flex: 1;
        margin-right: var(--spacing-sm);
      }

      .book-author {
        color: var(--text-secondary);
        font-size: 0.875rem;
        margin-bottom: var(--spacing-md);
      }

      /* Genre tags */
      .genres {
        display: flex;
        flex-wrap: wrap;
        gap: var(--spacing-xs);
      }

      .genre-tag {
        padding: var(--spacing-xs) var(--spacing-sm);
        background: var(--bg-tertiary);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-sm);
        font-size: 0.75rem;
        color: var(--text-secondary);
        transition: var(--transition);
      }

      .genre-tag:hover {
        border-color: var(--primary-500);
        color: var(--primary-400);
      }

      /* Select */
      .select {
        width: 100%;
        padding: var(--spacing-sm) var(--spacing-md);
        background: var(--bg-tertiary);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        color: var(--text-primary);
        font-size: 0.9rem;
        cursor: pointer;
        transition: var(--transition);
        margin-bottom: var(--spacing-lg);
      }

      .select:focus {
        outline: none;
        border-color: var(--primary-500);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
      }

      .select option {
        background: var(--bg-secondary);
        color: var(--text-primary);
      }

      /* Random result */
      .random-result {
        display: none;
        margin-top: var(--spacing-xl);
        animation: slideIn 0.3s ease-out;
      }

      .random-result.show {
        display: block;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .result-label {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--primary-400);
        margin-bottom: var(--spacing-md);
      }

      /* Empty state */
      .empty-state {
        grid-column: 1 / -1;
        text-align: center;
        padding: var(--spacing-2xl);
        color: var(--text-muted);
      }

      .empty-icon {
        font-size: 3rem;
        margin-bottom: var(--spacing-md);
        opacity: 0.5;
      }

      .empty-text {
        font-size: 0.9rem;
      }

      /* Centered layout for random page */
      .centered-container {
        max-width: 500px;
        margin: 0 auto;
      }

      /* Loading state */
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      .loading {
        animation: pulse 2s infinite;
      }

      /* Responsive */
      @media (max-width: 640px) {
        h1 {
          font-size: 2rem;
        }

        nav {
          gap: var(--spacing-md);
        }

        .nav-btn {
          font-size: 0.875rem;
          padding: var(--spacing-xs) var(--spacing-md);
        }
      }
    </style>
  </head>

      // Fonction pour afficher une page
      function showPage(pageId) {
        document.querySelectorAll(".page").forEach((page) => {
          page.classList.remove("active");
        });
        document.querySelectorAll(".nav-btn").forEach((btn) => {
          btn.classList.remove("active");
        });
        document.getElementById(pageId).classList.add("active");
        event.target.classList.add("active");

        if (pageId === "random-page") {
          updateGenreSelect();
          document.getElementById("random-result").classList.remove("show");
        }
        if (pageId === "list-page") {
          displayBooks();
        }
      }

      // Fonction pour afficher tous les livres
      function displayBooks() {
        const container = document.getElementById("books-container");
        const stats = document.getElementById("stats");

        if (books.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">📚</div>
              <p class="empty-text">Votre bibliothèque est vide</p>
            </div>
          `;
          stats.textContent = "";
          return;
        }

        stats.textContent = `${books.length} livre${books.length > 1 ? "s" : ""} dans votre collection`;

        container.innerHTML = books
          .map(
            (book, index) => `
              <div class="book-card">
                <div class="book-header">
                  <h3 class="book-title">${book.title}</h3>
                  <button onclick="deleteBook(${index})" class="btn-delete" title="Supprimer">
                    ×
                  </button>
                </div>
                <p class="book-author">${book.author}</p>
                <div class="genres">
                  ${book.genres
                    .map(
                      (genre) => `
                        <span class="genre-tag">${genre}</span>
                      `
                    )
                    .join("")}
                </div>
              </div>
            `
          )
          .join("");
      }

      // Fonction pour ajouter un livre (désactivée dans ton exemple)
      function addBook() {
        const title = document.getElementById("book-title").value.trim();
        const author = document.getElementById("book-author").value.trim();
        const genresInput = document.getElementById("book-genres").value.trim();

        if (!title || !author || !genresInput) {
          if (!title) document.getElementById("book-title").style.borderColor = "#ef4444";
          if (!author) document.getElementById("book-author").style.borderColor = "#ef4444";
          if (!genresInput) document.getElementById("book-genres").style.borderColor = "#ef4444";

          setTimeout(() => {
            document.getElementById("book-title").style.borderColor = "";
            document.getElementById("book-author").style.borderColor = "";
            document.getElementById("book-genres").style.borderColor = "";
          }, 2000);
          return;
        }

        const genres = genresInput.split(",").map((g) => g.trim()).slice(0, 3);
        const newBook = { title: title, author: author, genres: genres };
        books.push(newBook);

        // Réinitialiser le formulaire
        document.getElementById("book-title").value = "";
        document.getElementById("book-author").value = "";
        document.getElementById("book-genres").value = "";

        // Afficher les livres mis à jour
        displayBooks();

        // Animation de confirmation
        const btn = event.target;
        const originalText = btn.innerHTML;
        btn.innerHTML = "<span>✓ Ajouté</span>";
        btn.style.background = "#10b981";
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.style.background = "";
        }, 1500);
      }

      // Fonction pour supprimer un livre
      function deleteBook(index) {
        books.splice(index, 1);
        displayBooks();
      }

      // Fonction pour mettre à jour le sélecteur de genres
      function updateGenreSelect() {
        const select = document.getElementById("genre-select");
        const allGenres = new Set();

        books.forEach((book) => {
          book.genres.forEach((genre) => allGenres.add(genre));
        });

        select.innerHTML = '<option value="">Sélectionner un genre</option>';

        if (allGenres.size === 0) {
          select.innerHTML += '<option value="" disabled>Aucun genre disponible</option>';
          return;
        }

        Array.from(allGenres)
          .sort()
          .forEach((genre) => {
            const count = books.filter((book) => book.genres.includes(genre)).length;
            select.innerHTML += `<option value="${genre}">${genre} (${count})</option>`;
          });
      }

      // Fonction pour obtenir un livre aléatoire
      function getRandomBook() {
        const selectedGenre = document.getElementById("genre-select").value;
        const resultDiv = document.getElementById("random-result");
        const contentDiv = document.getElementById("random-book-content");

        if (!selectedGenre) {
          const select = document.getElementById("genre-select");
          select.style.borderColor = "#ef4444";
          setTimeout(() => {
            select.style.borderColor = "";
          }, 2000);
          return;
        }

        const filteredBooks = books.filter((book) => book.genres.includes(selectedGenre));

        if (filteredBooks.length === 0) {
          contentDiv.innerHTML = `
            <p style="color: var(--text-secondary); text-align: center;">
              Aucun livre trouvé pour ce genre
            </p>
          `;
          resultDiv.classList.add("show");
          return;
        }

        const randomBook = filteredBooks[Math.floor(Math.random() * filteredBooks.length)];

        resultDiv.classList.remove("show");
        setTimeout(() => {
          contentDiv.innerHTML = `
            <h3 class="book-title" style="font-size: 1.25rem; margin-bottom: 0.5rem;">
              ${randomBook.title}
            </h3>
            <p class="book-author" style="margin-bottom: 1rem;">
              ${randomBook.author}
            </p>
            <div class="genres">
              ${randomBook.genres
                .map(
                  (genre) => `
                    <span class="genre-tag">${genre}</span>
                  `
                )
                .join("")}
            </div>
          `;
          resultDiv.classList.add("show");
        }, 100);
      }

      // Initialiser la page au chargement
      document.addEventListener("DOMContentLoaded", () => {
        displayBooks();
      });
    </script>
