<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ma Bibliothèque!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="min-h-screen bg-base-200">
    <div class="max-w-6xl mx-auto p-4">
      <header class="text-center py-12">
        <h1
          class="text-4xl font-light tracking-tight bg-gradient-to-r from-base-content to-base-content/50 bg-clip-text text-primary mb-8"
        >
          Ma Bibliothèque!
        </h1>
        <div role="tablist" class="tabs tabs-border justify-center flex-wrap">
          <button
            role="tab"
            class="tab tab-active"
            onclick="showPage('home-page')"
          >
            Accueil
          </button>
          <button
            role="tab"
            class="tab"
            onclick="showPage('list-page')"
          >
            Tous mes livres
          </button>
          <button role="tab" class="tab" onclick="showPage('wishlist-page')">
            Wishlist
          </button>
          <button role="tab" class="tab" onclick="showPage('challenge-page')">
            Mon Challenge
          </button>
          <button role="tab" class="tab" onclick="showPage('stats-page')">
            Statistiques
          </button>
          <button role="tab" class="tab" onclick="showPage('random-page')">
            Quiz lecture
          </button>
          <button role="tab" class="tab" onclick="showPage('loans-page')">
            Emprunts
          </button>
        </div>
      </header>

      <!-- Page Accueil (Bibliothèque visuelle) -->
      <div id="home-page" class="page active">
        <div class="flex justify-between items-center mb-4">
          <button id="edit-mode-btn" onclick="toggleEditMode()" class="btn btn-ghost btn-sm opacity-40 hover:opacity-100 gap-1">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            <span class="text-xs">Edit</span>
          </button>
          <div id="shelf-legend" class="text-xs opacity-40"></div>
        </div>
        <div id="bookshelf-container"></div>
      </div>

      <!-- Page Liste des Livres -->
      <div id="list-page" class="page">
        <div class="card card-border bg-base-100 mb-6">
          <div class="card-body">
            <h2 class="card-title">Ajouter un livre</h2>
            <div class="grid gap-4 md:grid-cols-3">
              <input
                type="text"
                id="book-title"
                class="input w-full"
                placeholder="Titre du livre"
              />
              <input
                type="text"
                id="book-author"
                class="input w-full"
                placeholder="Auteur"
              />
              <input
                type="text"
                id="book-genres"
                class="input w-full"
                placeholder="Genres (max 3, virgules)"
              />
            </div>
            <div class="flex items-center gap-4 mt-2">
              <label class="flex items-center gap-2 cursor-pointer">
                <input
                  type="checkbox"
                  id="book-gift"
                  class="toggle toggle-sm"
                  onchange="toggleGiftInput()"
                />
                <span class="text-sm">Cadeau</span>
              </label>
              <input
                type="number"
                id="book-year"
                class="input w-28"
                placeholder="Année"
                min="2000"
                max="2030"
              />
              <button type="button" onclick="toggleAddExtras()" class="btn btn-ghost btn-xs opacity-50" id="add-extras-btn">+ Voir plus</button>
            </div>
            <div id="add-extras" class="hidden mt-3">
              <div class="grid gap-4 md:grid-cols-3">
                <input type="number" id="book-pages" class="input w-full" placeholder="Nombre de pages" min="1" />
                <select id="book-size" class="select w-full">
                  <option value="" disabled selected>Taille</option>
                  <option value="1">Petit</option>
                  <option value="2">Moyen</option>
                  <option value="3">Grand</option>
                </select>
                <div class="flex items-center gap-2">
                  <input type="color" id="book-color" class="w-8 h-8 cursor-pointer border border-base-300" value="#2c2c2c" />
                  <div id="add-color-swatches" class="flex flex-wrap gap-1"></div>
                </div>
              </div>
            </div>
            <div class="card-actions mt-4">
              <button onclick="addBook()" class="btn btn-primary">
                Ajouter à la bibliothèque
              </button>
            </div>
          </div>
        </div>

        <div
          id="stats"
          class="text-sm text-base-content/60 mb-6 flex items-center gap-2"
        ></div>
        <div
          id="books-container"
          class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3"
        ></div>
      </div>

      <!-- Page Wishlist -->
      <div id="wishlist-page" class="page">
        <div class="card card-border bg-base-100 mb-6">
          <div class="card-body">
            <h2 class="card-title">Ajouter à ma wishlist</h2>
            <div class="grid gap-4 md:grid-cols-3">
              <input
                type="text"
                id="wish-title"
                class="input w-full"
                placeholder="Titre du livre"
              />
              <input
                type="text"
                id="wish-author"
                class="input w-full"
                placeholder="Auteur"
              />
              <input
                type="text"
                id="wish-genres"
                class="input w-full"
                placeholder="Genres (max 3, virgules)"
              />
            </div>
            <div class="card-actions mt-4">
              <button onclick="addWishlistBook()" class="btn btn-primary">
                Ajouter à la wishlist
              </button>
            </div>
          </div>
        </div>
        <div
          id="wishlist-container"
          class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3"
        ></div>
      </div>

      <!-- Page Quizz Genre -->
      <div id="random-page" class="page">
        <div class="max-w-md mx-auto">
          <div id="quiz-container"></div>
        </div>
      </div>

      <!-- Page Emprunts -->
      <div id="loans-page" class="page">
        <div class="card card-border bg-base-100 mb-6">
          <div class="card-body">
            <h2 class="card-title">Noter un emprunt</h2>
            <div class="grid gap-4 md:grid-cols-3">
              <select id="loan-book" class="select w-full">
                <option disabled selected>Choisir un livre...</option>
              </select>
              <input type="text" id="loan-person" class="input w-full" placeholder="Emprunté par..." />
              <input type="date" id="loan-date" class="input w-full" />
            </div>
            <div class="card-actions mt-4">
              <button onclick="addLoan()" class="btn btn-primary">Enregistrer l'emprunt</button>
            </div>
          </div>
        </div>
        <div id="loans-container"></div>
      </div>

      <!-- Page Statistiques -->
      <div id="stats-page" class="page">
        <div id="stats-content"></div>
      </div>

      <!-- Page Challenge -->
      <div id="challenge-page" class="page">
        <div id="challenge-content"></div>
      </div>
    </div>

    <!-- Modal sélecteur de livres pour le challenge -->
    <dialog id="book-selector-modal" class="modal">
      <div class="modal-box">
        <div class="flex justify-between items-center mb-4">
          <h3 class="font-bold text-lg">Ajouter un livre au challenge</h3>
          <button
            onclick="closeBookSelector()"
            class="btn btn-sm btn-circle btn-ghost"
          >
            ✕
          </button>
        </div>
        <input
          type="text"
          id="book-selector-search"
          class="input w-full mb-4"
          placeholder="Rechercher un livre..."
          oninput="filterBookSelector()"
        />
        <div id="book-selector-list" class="max-h-80 overflow-y-auto"></div>
      </div>
      <form method="dialog" class="modal-backdrop">
        <button>close</button>
      </form>
    </dialog>

    <!-- Modal édition de livre -->
    <dialog id="edit-book-modal" class="modal">
      <div class="modal-box">
        <div class="flex justify-between items-center mb-4">
          <h3 class="font-bold text-lg">Modifier le livre</h3>
          <button onclick="closeEditModal()" class="btn btn-sm btn-circle btn-ghost">✕</button>
        </div>
        <input type="hidden" id="edit-book-id" />
        <div class="flex flex-col gap-3">
          <input type="text" id="edit-book-title" class="input w-full" placeholder="Titre" />
          <input type="text" id="edit-book-author" class="input w-full" placeholder="Auteur" />
          <input type="text" id="edit-book-genres" class="input w-full" placeholder="Genres (virgules)" />
          <div class="grid grid-cols-2 gap-3">
            <input type="number" id="edit-book-pages" class="input w-full" placeholder="Nombre de pages" min="1" />
            <input type="number" id="edit-book-year" class="input w-full" placeholder="Année" min="2000" max="2030" />
          </div>
          <div class="grid grid-cols-2 gap-3">
            <select id="edit-book-size" class="select w-full">
              <option value="1">Petit</option>
              <option value="2">Moyen</option>
              <option value="3">Grand</option>
            </select>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" id="edit-book-gift" class="toggle toggle-sm" />
              <span class="text-sm">Cadeau</span>
            </label>
          </div>
          <div>
            <label class="text-sm opacity-60 mb-1 block">Couleur</label>
            <div class="flex items-center gap-2 flex-wrap">
              <div id="edit-color-swatches" class="flex flex-wrap gap-1"></div>
              <input type="color" id="edit-book-color" class="w-8 h-8 cursor-pointer border border-base-300" title="Couleur personnalisée" />
            </div>
          </div>
          <div>
            <label class="text-sm opacity-60 mb-1 block">Note</label>
            <div id="edit-book-rating" class="flex gap-1"></div>
          </div>
        </div>
        <div class="modal-action">
          <button onclick="saveBookEdit()" class="btn btn-primary">Enregistrer</button>
          <button onclick="closeEditModal()" class="btn btn-ghost">Annuler</button>
        </div>
      </div>
      <form method="dialog" class="modal-backdrop">
        <button>close</button>
      </form>
    </dialog>

    <script type="module" src="/script.js"></script>
  </body>
</html>
